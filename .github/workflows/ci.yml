# Unit tests on every push and PR. Owned by WS-F (desktop_build_plan.md §5).
# The pygame tests run headless through SDL's dummy drivers, which is what
# makes the windowed renderer testable here at all.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" on the Actions tab: tests + both frozen builds

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  # The terminal build must keep working with zero installs. game/ and the
  # curses path are stdlib-only; pygame tests must skip, not fail.
  stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: game/ and main.py import nothing outside the standard library
        run: python -c "import main, game.state, game.paths, game.settings, game.crashlog, game.version"
      - name: tests pass with nothing installed
        run: python -m unittest discover -s tests -v

  # Freeze the game on both OSes and launch the result (WS-E/WS-F). This is
  # the only place the Windows exe is built before a release -- PyInstaller
  # can't cross-compile from the Linux dev box -- so a PR that breaks the
  # spec, a hidden import or a bundled file fails here, not at tag time.
  # The zips are kept for a week for anyone who wants to try a PR build.
  # The slow part: freeze and smoke-test the exe on both OSes. Only for main,
  # tags and manual runs -- branches and PRs get the tests alone.
  frozen-build:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Build (Linux)
        if: runner.os != 'Windows'
        run: ./packaging/build.sh
      - name: Frozen smoke test
        run: python -m unittest tests.test_frozen_smoke -v
      - uses: actions/upload-artifact@v4
        with:
          name: PyRogue-${{ runner.os }}-ci
          path: dist/PyRogue-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
